{% extends "authorized.html" %}
{% load static %}

{% block content %}

<div class="card-header p-3">
  {{ note.title }}
</div>

<div class="card-body p-4">
  <blockquote class="blockquote mb-0">
    <div id="note-blocks">
      {% for block in text_blocks %}
      <div class="block-wrapper">
        <div id="block-{{ block.id }}" 
             class="text-block" 
             contenteditable="true" 
             data-block-id="{{ block.id }}"
             hx-post="{% url 'update_block' block.id %}" 
             hx-trigger="input changed delay:500ms"
             hx-swap="none">
          <p>{{ block.content|default:"Edit this text..." }}</p>
        </div>
        <button class="delete-btn" 
                hx-delete="{% url 'delete_block' block.id %}" 
                hx-target="closest .block-wrapper"
                hx-swap="outerHTML"
                hx-confirm="Are you sure you want to delete this block?"
                hx-trigger="click">
            &times; 
        </button>
      </div> {% endfor %} </div>
    
    <div class="mt-3">
      <button class="btn btn-outline-secondary"
              hx-post="{% url 'add_text_block' note.id %}"
              hx-target="#note-blocks"
              hx-swap="beforeend">
        + Text
      </button>
      
      <button class="btn btn-outline-secondary">+ Image</button>
    </div>
    
    <br />
    <footer class="blockquote-footer">
      Created At <cite title="Created At">[{{ note.created_at }}]</cite>
    </footer>
  </blockquote>
</div>
{% endblock %}
