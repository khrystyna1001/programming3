{% extends "authorized.html" %}
{% load static %}
{% load widget_tweaks %}

{% block content %}

<div class="container py-4" hx-swap="none"> 
    {% csrf_token %}

    <div class="p-4 pb-3 bg-light-subtle border-bottom"> 
        {{ note.title }}
    </div>

    <div class="card-body p-4 pt-4"> <blockquote class="blockquote mb-0">
            <div id="note-blocks">
                <div id="note-content-div" 
                    class="note-wrapper fs-5" 
                    contenteditable="true"
                    name="content" data-note-id="{{ note.id }}"
                    style="min-height: 250px; outline: none; border: none; background-color: white;" > 
                    
                    {{ note.content }} 
                    
                </div>
            </div>
        </blockquote>
    </div>
    
    <div class="card-footer bg-white border-0 p-3">
        <div class="d-flex justify-content-end">
            <button
                type="button"
                hx-patch="{% url 'note_update' note.id %}"
                hx-include="[name='title'], #note-content-div"
                class="btn btn-success shadow-sm">
                <i class="bi bi-save"></i> Save Changes
            </button>
        </div>
    </div>

    <div class="card-footer bg-white border-0 p-3">
        <div class="d-flex justify-content-end">
            <button
                type="button"
                hx-delete="{% url 'note_delete' note.id %}"
                hx-confirm="Are you sure you want to delete this note?"
                hx-include="[name='title'], #note-content-div"
                class="btn btn-danger shadow-sm">
                <i class="bi bi-trash"></i> Delete Note
            </button>
        </div>
    </div>
    
    <div class="mt-3 text-end">
        <footer class="blockquote-footer">
            Last Updated: <cite title="Updated At">[{{ note.updated_at|date:"M d, Y H:i" }}]</cite>
        </footer>
    </div>
</div>
{% endblock %}
