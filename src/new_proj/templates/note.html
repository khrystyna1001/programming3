{% extends "authorized.html" %}
{% load static %}
{% load widget_tweaks %}

{% block content %}
<div class="container py-4">
    <div id="note-form">
        <form method="post"
              hx-patch="/notes/{{note.id}}/update/"
              hx-target="#note-form"
              hx-swap="outerHTML"
              hx-trigger="submit">
            {% csrf_token %}
            
            <div class="p-4 pb-3 bg-light-subtle border-bottom"> 
                <input type="text" 
                       name="title" 
                       value="{{ form.title.value|default:note.title }}" 
                       class="form-control border-0 bg-transparent fs-4 fw-bold"
                       style="box-shadow: none;"
                       required>
            </div>

            <div class="card-body p-4 pt-4">
                <div id="note-blocks">
                    <textarea name="content" 
                             class="form-control border-0 p-0 fs-5" 
                             style="min-height: 300px; resize: none; box-shadow: none;"
                             required>{{ form.content.value|default:note.content }}</textarea>
                </div>
            </div>
            
            <div class="card-footer bg-white border-0 p-3">
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-success shadow-sm">
                        <i class="bi bi-save"></i> Save Changes
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
